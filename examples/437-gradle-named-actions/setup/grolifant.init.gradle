// Route this one historical coordinate to the local Maven repository with the pin's verified JAR.
def exactGrolifant = { RepositoryHandler repos ->
    repos.exclusiveContent {
        forRepository {
            repos.maven {
                name = 'L15ExactGrolifant'
                url = new File(System.getProperty('l15.verified.repository')).toURI()
                metadataSources { mavenPom(); artifact() }
            }
        }
        filter { includeVersion('org.ysb33r.gradle', 'grolifant', '0.16.1') }
    }
}
beforeSettings { settings -> exactGrolifant(settings.dependencyResolutionManagement.repositories) }
allprojects { buildscript { exactGrolifant(repositories) } }
