\* Figure 8 of the paper: four terms and one entry per leader. A leader of term 1 appends an entry it never gets to
\* replicate; a leader of term 2 appends its own at the same index; the first comes back as leader of term 3 and
\* replicates its entry of term 1 to a majority, which the commit rule must not count as a commit, since the second,
\* whose last entry is from the later term 2, can still be elected in term 4 without it and overwrite it. Three
\* terms cannot show this, and three entries would make the run longer than it needs to be.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 4
    MaxEntries = 1
    DelayedReplies = FALSE

SYMMETRY Perms

INVARIANTS
    TypeOK
    KernelNeverThrows
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

PROPERTIES
    CommittedEntriesNeverChange
    TermsNeverDecrease
    LeaderAppendOnly
