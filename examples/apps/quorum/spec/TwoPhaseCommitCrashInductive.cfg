\* The inductive check of TwoPhaseCommitInductive.cfg with the coordinator's crashes and restarts among the steps: TLC
\* starts from every state the invariant Inductive admits, the coordinator up or down, and checks that a crash, a
\* restart on the recovery rule, and every other step land in a state it admits. One crash is enough: the invariant
\* says nothing about how many there were, only that a coordinator that is down has crashed, and the step from any
\* admitted state is the same whatever the count.
INIT InductiveInit
NEXT Next

CONSTANTS
    Participants = {p1, p2, p3}
    MaxCrashes = 1
    MaxParticipantCrashes = 0

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator
    VotesInFlightAreUncounted
    DecisionMatchesThePhase
    ParticipantsAgreeWithTheirVotes
    CommitNeedsEveryVote
    BroadcastOnceUp
    DownOnlyAfterACrash
