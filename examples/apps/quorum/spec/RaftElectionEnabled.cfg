\* A check of the model itself, not of the code: that the enabling predicates the fairness conditions use
\* (CanTimeout, CanCanvass, CanHeartbeat) agree with TLC's ENABLED in every reachable state. TLC takes the better
\* part of a minute on it, which is why the predicates exist; run it after changing an action.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    LeftBehind = {}
    DelayedReplies = FALSE
    History = FALSE

INVARIANTS
    EnablingAgrees
