\* The model TLC checks: three servers and three terms. Small on purpose, so that a counterexample trace is short
\* enough to read; the bugs this model is for need two candidates in one term, or a leader and a term after its own.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    LeftBehind = {}
    DelayedReplies = FALSE
    History = FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
