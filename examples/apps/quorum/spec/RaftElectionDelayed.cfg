\* Delayed replies: the reply to a vote request is a step of its own, which the candidate may take after it has timed
\* out into a newer term, stepped down, or won. The one-step RPC of the other configurations never hands the role
\* machine a reply from an older term than the server's own; this one does, and checks what the role machine makes
\* of it, under the usual invariants and action properties. Two terms rather than three: a reply from term 1 taken
\* in term 2 is what this configuration is for, and a third term adds runs (364,236 states against 20,351) and no
\* row of either contract.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 2
    LeftBehind = {}
    DelayedReplies = TRUE
    History = FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
