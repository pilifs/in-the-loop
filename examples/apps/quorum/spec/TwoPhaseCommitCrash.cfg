\* The coordinator may crash, up to MaxCrashes times in a run: between steps, or in the middle of one, after it has
\* logged a phase change and before the broadcast goes out. It restarts with the phase it logged and acts on the
\* recovery rule, generated from Recovery#decide, and the restart can be cut short by a crash of its own. The
\* invariants and the two temporal properties are those of TwoPhaseCommit.cfg: every participant still decides, under
\* the added fairness condition that a crashed coordinator restarts, and the protocol still implements transaction
\* commit. Two crashes are enough for every order of a crash, a restart and a decision; a third adds states and no runs
\* of a new shape.
SPECIFICATION Spec

CONSTANTS
    Participants = {p1, p2, p3}
    MaxCrashes = 2
    MaxParticipantCrashes = 0

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator

PROPERTIES
    EveryParticipantDecides
    ImplementsTransactionCommit
