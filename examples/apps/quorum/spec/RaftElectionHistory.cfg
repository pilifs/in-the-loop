\* The history check: the three-server model with History = TRUE, so that elected and voted record every term a
\* server has led and every vote cast, under the two invariants that are about a run rather than a state: at most
\* one leader elected per term, and at most one vote per server per term, as the paper states them. The state
\* invariants of the other configurations hold in a run in which a term's leader steps down and the term then
\* elects another; these do not. Each state carries its history, so there are more of them, which is why the
\* recording is a constant that the other configurations leave off and keep their state counts.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    LeftBehind = {}
    DelayedReplies = FALSE
    History = TRUE

INVARIANTS
    TypeOK
    AtMostOneLeaderPerTerm
    AtMostOneVotePerTerm
