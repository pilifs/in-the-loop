\* The inductive check: TLC starts from every state the invariant Inductive admits, reachable or not, rather than
\* from Init, takes every step Next allows, and checks the invariant again, conjunct by conjunct. No counterexample
\* means Inductive is closed under Next: atomicity holds by induction, for any run of three participants, however
\* long. A counterexample is one step from a state that need not be reachable: a bug, or a conjunct a correct change
\* makes too strong; TwoPhaseCommit.cfg, which runs from Init, tells which.
INIT InductiveInit
NEXT Next

CONSTANTS
    Participants = {p1, p2, p3}
    MaxCrashes = 0
    MaxParticipantCrashes = 0

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator
    VotesInFlightAreUncounted
    DecisionMatchesThePhase
    ParticipantsAgreeWithTheirVotes
    CommitNeedsEveryVote
    BroadcastOnceUp
    DownOnlyAfterACrash
