\* The inductive check of TwoPhaseCommitCrashInductive.cfg with the participants' crashes and restarts among the steps:
\* TLC starts from every state the invariant Inductive admits, each process up or down, and checks that a crash of either
\* kind, a restart on either recovery rule, and every other step land in a state it admits. One crash of each kind is
\* enough: the invariant says nothing about how many there were, only that a process that is down has crashed.
INIT InductiveInit
NEXT Next

CONSTANTS
    Participants = {p1, p2, p3}
    MaxCrashes = 1
    MaxParticipantCrashes = 1

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator
    VotesInFlightAreUncounted
    DecisionMatchesThePhase
    ParticipantsAgreeWithTheirVotes
    CommitNeedsEveryVote
    BroadcastOnceUp
    DownOnlyAfterACrash
    ParticipantsDownOnlyAfterACrash
