\* The model TLC checks: a window of two calls, a failure rate of one in two, two probes, a wait of two ticks, and
\* two calls in flight at once. Small on purpose, so that a counterexample trace is short enough to read; the bugs
\* this model is for need one call in flight while the breaker changes state.
SPECIFICATION Spec

CONSTANTS
    WindowSize = 2
    FailureRate = 50
    PermittedProbes = 2
    WaitDuration = 2
    MaxInFlight = 2

INVARIANTS
    TypeOK
    NoCallBeforeTheWait
    OpenShieldsTheDependency
    ClosedOnlyAfterEveryProbe
    ProbesAreLimited
    ClosedOnlyBelowTheThreshold
