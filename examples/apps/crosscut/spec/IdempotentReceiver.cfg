\* The model TLC checks: one request sent three times under the same key. Small on purpose, so that a
\* counterexample trace is short enough to read; the bugs this model is for need one attempt in flight and one more.
SPECIFICATION Spec

CONSTANTS
    Attempts = {a1, a2, a3}
    Expires = FALSE

INVARIANTS
    TypeOK
    OneExecutionAtATime
    AtMostOnce
    ReplayedResponsesExist
