\* The model TLC checks: three threads that need the same class. Small on purpose, so that a counterexample trace
\* is short enough to read; the bugs this model is for need one thread initializing and one more arriving.
SPECIFICATION Spec

CONSTANTS
    Threads = {t1, t2, t3}

INVARIANTS
    TypeOK
    UsedOnlyWhenInitialized
    InitializedAtMostOnce
    OneInitializer
