\* The model TLC checks: two customers competing for one seat, a clock of four ticks, holds that last one tick.
\* Small on purpose: the bugs this model is for need two customers, one seat and one expiry, and a small model
\* keeps the counterexample traces short enough to read.
SPECIFICATION Spec

CONSTANTS
    Customers = {alice, bob}
    Seats = {s1}
    MaxTime = 3
    HoldTtl = 1
    Sweeper = TRUE

INVARIANTS
    TypeOK
    NoDoubleSale
    ConfirmedOrdersOwnTheirSeats
    SoldSeatsHaveConfirmedOrders
    NoMoneyStranded
    NothingDeadLettered
    AgreementAtQuiescence
