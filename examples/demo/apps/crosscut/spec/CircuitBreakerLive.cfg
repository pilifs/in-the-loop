\* The liveness check: the model under the fairness conditions of LiveSpec, with the three temporal properties at
\* the end of the module after the invariants. A counterexample is a run that goes on forever: a prefix, then a
\* state the system never leaves (Stuttering) or a cycle it never leaves (Back to state N). The bounds are the
\* ones of CircuitBreaker.cfg.
SPECIFICATION LiveSpec

CONSTANTS
    WindowSize = 2
    FailureRate = 50
    PermittedProbes = 2
    WaitDuration = 2
    MaxInFlight = 2

INVARIANTS
    TypeOK
    NoCallBeforeTheWait
    OpenShieldsTheDependency
    ClosedOnlyAfterEveryProbe
    ProbesAreLimited
    ClosedOnlyBelowTheThreshold

PROPERTIES
    AnOpenBreakerProbesAgain
    ARecoveredDependencyIsUsed
    ADeadDependencyIsLeftAlone
