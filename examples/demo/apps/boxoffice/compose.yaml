# Infrastructure for running the services locally: docker compose up -d --wait
name: boxoffice

services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "127.0.0.1:9092:9092"

  mongo:
    image: mongo:8.0
    # Transactions need a replica set. The health check initiates a single-node one on first start.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 2s
      retries: 30

volumes:
  mongo-data:
