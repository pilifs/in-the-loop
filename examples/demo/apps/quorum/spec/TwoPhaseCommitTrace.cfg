\* Trace validation: the runs of the Java nodes recorded in TwoPhaseCommitTraces.tla, each walked by TLC and held
\* to the model's next-state relation. The participants are the ones the scripts name; crashes as the scripts have.
SPECIFICATION TraceSpec

CONSTANTS
    Participants = {"p1", "p2", "p3"}
    MaxCrashes = 2
    MaxParticipantCrashes = 2

INVARIANTS
    TypeOK
    StartsAtTheInitialState

PROPERTIES
    EveryStepIsOneOfTheModel
