\* The election restriction: one server, s1, holds the log a deposed leader of term 1 left behind, three entries of
\* its term, while the other two hold an entry of term 2 at index 2, committed since a majority holds it. The
\* longer log is the one behind, and the vote rule must refuse it: a leader elected without the committed entry
\* would overwrite it. Leader completeness is checked for these logs; with every log the same, as in the other
\* configurations, it holds trivially.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    LeftBehind = {s1}
    DelayedReplies = FALSE
    History = FALSE

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    LeaderCompleteness
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
