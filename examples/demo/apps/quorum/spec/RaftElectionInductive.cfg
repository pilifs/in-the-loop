\* The inductive check: TLC starts from every state the invariant Inductive admits, reachable or not, rather than
\* from Init, takes every step Next allows, and checks the invariant again. No counterexample means Inductive is
\* closed under Next: election safety holds by induction, for any run of three servers and three terms, however
\* long. A counterexample is one step from a state that need not be reachable: a bug, or a conjunct of Inductive
\* that a correct change makes too strong; RaftElection.cfg and RaftElectionFour.cfg, which run from Init, tell
\* which. The invariants are the conjuncts of Inductive, listed one by one so that TLC names the one that fails.
INIT InductiveInit
NEXT Next

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    LeftBehind = {}

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    VotesAreBound
    TalliesOfATermAreDisjoint
    CampaignersVoteForThemselves
    TalliesHoldTheirOwnersVote
    TermZeroIsQuiet
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
