\* Four servers: a majority is three votes, so a candidate can hold a vote besides its own and still be short of one,
\* which three servers never show; what a candidate does with such a tally is checked here. The symmetry set tells
\* TLC that the servers are interchangeable: of the states that differ only by a permutation of the servers'
\* names, it explores one. (A symmetry set is unsound for liveness properties, of which this model has none.)
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3, s4}
    MaxTerm = 3
    LeftBehind = {}
    DelayedReplies = FALSE
    History = FALSE

SYMMETRY Perms

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
