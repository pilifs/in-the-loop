\* The liveness check: three servers over three terms, with one entry per leader's log, under the fairness conditions
\* of LiveSpec, with the three temporal properties at the end of the module after the invariants and the action
\* properties. Three terms, so that a run within the budget has the leaders of two; one entry, since a second
\* multiplies the states by eight and the properties are about an entry reaching every log and getting committed. A counterexample is a run that goes on forever: a prefix, then a state the system never leaves
\* (Stuttering) or a cycle it never leaves (Back to state N). No symmetry set: TLC's liveness checking is unsound
\* under one.
SPECIFICATION LiveSpec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    MaxEntries = 1
    DelayedReplies = FALSE

INVARIANTS
    TypeOK
    KernelNeverThrows
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

PROPERTIES
    CommittedEntriesNeverChange
    TermsNeverDecrease
    LeaderAppendOnly
    FollowersCatchUp
    FollowersLearnCommits
    OwnEntriesAreCommitted
