\* Delayed replies: the reply to an AppendEntries request is a step of its own, which the leader may take after it
\* has sent the follower another request and taken its reply, been deposed, or been elected again in a later term;
\* the network may hand it the same reply twice, or never. The one-step RPC of the other configurations hands the
\* reply rule nothing but the request it has just sent; this one hands it late and repeated replies, acceptances of
\* entries the leader has recorded already and refusals it has backed up from, and checks the leader's record of
\* its followers against what they hold, under the usual invariants and action properties. Two terms and one entry
\* per leader: a refusal a leader backs up from, then is handed again once the follower has caught up, needs a leader
\* elected with an entry a follower lacks, which takes two terms, and the entry can be refused by a heartbeat sent
\* after it; a second entry multiplies the states past what TLC checks in the build's budget.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 2
    MaxEntries = 1
    DelayedReplies = TRUE

SYMMETRY Perms

INVARIANTS
    TypeOK
    KernelNeverThrows
    MatchIndexIsRight
    NextIndexPastMatch
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

PROPERTIES
    CommittedEntriesNeverChange
    TermsNeverDecrease
    LeaderAppendOnly
