\* A check of the model itself, not of the code: that the enabling predicates the fairness conditions use
\* (CanTimeout, CanCanvass, CanReplicate, CanAdvanceCommit) agree with TLC's ENABLED in every reachable state of the
\* liveness configuration. TLC takes a while on it, which is why the predicates exist; run it after changing an action.
