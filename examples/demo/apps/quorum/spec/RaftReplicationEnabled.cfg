\* A check of the model itself, not of the code: that the enabling predicates the fairness conditions use
\* (CanTimeout, CanCanvass, CanAdvanceCommit) agree with TLC's ENABLED in every reachable state of the liveness
\* configuration. CanReplicate is left out, for the reason EnablingAgrees gives: its action shares its guard and its
\* next-state record, and ENABLED of a record that nests the follower's half inside the leader's is some thirty times
\* slower. TLC takes a while on it as it is, which is why the predicates exist; run it after changing an action.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 2
    MaxEntries = 1
    DelayedReplies = FALSE

INVARIANTS
    EnablingAgrees
