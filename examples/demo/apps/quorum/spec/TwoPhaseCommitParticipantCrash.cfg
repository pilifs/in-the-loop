\* The participants may crash too, up to MaxParticipantCrashes times in a run between them: between steps, or after
\* logging a vote and before sending it. A participant restarts with the state it logged and acts on its rule, generated
\* from Participant#decide: on the committed rule a prepared participant holds its locks until the decision, since it
\* cannot decide alone, and one that had not voted aborts. The coordinator may crash once as well, so that the two
\* kinds of crash meet. The invariants and the two temporal properties are those of TwoPhaseCommit.cfg: every participant
\* still decides, under the added fairness condition that a crashed participant restarts, and the protocol still
\* implements transaction commit. One participant crash is enough for every order of a participant's crash, its restart
\* and the coordinator's decision; a second adds states and no runs of a new shape.
SPECIFICATION Spec

CONSTANTS
    Participants = {p1, p2, p3}
    MaxCrashes = 1
    MaxParticipantCrashes = 1

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator

PROPERTIES
    EveryParticipantDecides
    ImplementsTransactionCommit
