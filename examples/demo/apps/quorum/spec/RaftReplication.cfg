\* The model TLC checks: three servers, three terms, and logs of up to two entries. Enough for a leader's log to
\* hold an entry of an earlier term under one of its own while a follower holds another entry of its own term in
\* the first one's place, which is what the append rule's consistency check is for: the leader's first try finds
\* the follower's log in conflict at the previous entry, and must not put the new entry after it.
SPECIFICATION Spec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3
    MaxEntries = 2

SYMMETRY Perms

INVARIANTS
    TypeOK
    KernelNeverThrows
    ElectionSafety
    LogMatching
    LeaderCompleteness
    StateMachineSafety

PROPERTIES
    CommittedEntriesNeverChange
    TermsNeverDecrease
    LeaderAppendOnly
