\* The model TLC checks: three participants. Small on purpose, so that a counterexample trace is short enough to
\* read; the bugs this model is for need one participant that answers and one that does not.
SPECIFICATION Spec

CONSTANTS
    Participants = {p1, p2, p3}

INVARIANTS
    TypeOK
    Atomicity
    CommitFollowsTheCoordinator

PROPERTIES
    EveryParticipantDecides
    ImplementsTransactionCommit
