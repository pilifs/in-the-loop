\* The liveness check: the three-server model under the fairness conditions of LiveSpec, with the two temporal
\* properties at the end of the module after the invariants and the action properties. A counterexample is a run
\* that goes on forever: a prefix, then a state the system never leaves (Stuttering) or a cycle it never leaves
\* (Back to state N). No symmetry set: TLC's liveness checking is unsound under one.
SPECIFICATION LiveSpec

CONSTANTS
    Servers = {s1, s2, s3}
    MaxTerm = 3

INVARIANTS
    TypeOK
    ElectionSafety
    LeaderHasAMajority
    KernelNeverThrows

PROPERTIES
    TermsNeverDecrease
    LeadersNeverCampaign
    ALeaderIsElected
    StaleLeadersStepDown
