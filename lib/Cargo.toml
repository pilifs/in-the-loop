[package]
name = "jvmcontract"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Formal verification of JVM bytecode as contracts: behavioural (every input of a finite domain, executed), regression (two versions proved equivalent with JBMC), capability (what a module can reach), and protocol models (TLA+ generated from a contract)."
license = "Apache-2.0"
repository = "https://github.com/pilifs/in-the-loop"
keywords = ["jvm", "bytecode", "formal-verification", "contracts", "sarif"]
categories = ["development-tools", "development-tools::testing"]
readme = "README.md"

[lib]
name = "jvmcontract"
path = "src/lib.rs"

[[bin]]
name = "jvmcontract"
path = "src/main.rs"

[dependencies]
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacker = "0.1"
clap = { version = "4", features = ["derive"] }
cadical = "0.1"

[dev-dependencies]
tempfile = "3"

# The bundled SAT solver is C++ built by cc, which takes the profile's optimisation level: unoptimised it is many
# times slower, and tests run the solver.
[profile.dev.package.cadical]
opt-level = 3

# What `lib/tools/test_costs.py run` builds the default and unit tiers with (`cargo test --profile test-fast`): the
# dev profile, checks and all, at the first optimisation level. The tests that run the tool's own engine are several
# times faster so (tests/alignment.rs: 94 s as dev, 10 s here; tests/summaries.rs 13 s and 5 s), and a build after an
# edit takes 14 s where dev takes 7 s (measured 2026-11-17). Plain `cargo test` is still the dev profile.
[profile.test-fast]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.test-fast.package.cadical]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
